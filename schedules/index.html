<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pavilion Sports League - Schedule</title>
	<link rel="icon" href="../images/logo.png" />
	<link rel="stylesheet" href="schedules.css" />
</head>
<body>
	<header>
		<img class="title" src="../images/psl-title.png" alt="Pavilion Sports League" />
		<h1>Schedule</h1>
	</header>

	<div class="filters">
		<div class="filter-group">
			<span class="filter-label" id="day-label">Day</span>
			<div id="day-list" class="chip-list" role="group" aria-labelledby="day-label"></div>
		</div>
		<div class="filter-group">
			<span class="filter-label" id="sport-label">Sport</span>
			<div id="sport-list" class="chip-list" role="group" aria-labelledby="sport-label"></div>
		</div>
	</div>

	<p id="status" class="status">Loading schedule…</p>

	<div id="results" hidden>
		<p class="count"><span id="count"></span></p>
		<div id="days"></div>
	</div>

	<p class="back"><a href="../">← Home</a></p>

	<script src="../games.js"></script>
	<script src="../draws.js"></script>
	<script src="schedules.js"></script>
</body>
</html>
