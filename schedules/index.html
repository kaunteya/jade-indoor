<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pavilion Sports League - Schedule</title>
	<link rel="icon" href="../images/logo.png" />
	<link rel="stylesheet" href="schedules.css?v=1" />
</head>
<body>
	<header>
		<a class="title-link" href="../"><img class="title" src="../images/psl-title.png" alt="Pavilion Sports League" /></a>
		<h1>Schedule</h1>
	</header>

	<div class="filters">
		<div class="filter-group">
			<span class="filter-label" id="day-label">Day</span>
			<div id="day-list" class="chip-list" role="group" aria-labelledby="day-label"></div>
		</div>
		<div class="filter-group">
			<span class="filter-label" id="sport-label">Sport</span>
			<div id="sport-list" class="chip-list" role="group" aria-labelledby="sport-label"></div>
		</div>
	</div>

	<p id="status" class="status">Loading schedule…</p>

	<div id="results" hidden>
		<p class="count"><span id="count"></span></p>
		<div id="days"></div>
	</div>

	<p class="back"><a href="../">← Home</a></p>

	<!-- ?v= on every asset: draws.js and schedules.js have to change together (the page calls
	     loadResults, which lives in draws.js), and a browser holding a cached copy of one and
	     a fresh copy of the other breaks the page outright. Bump these when either changes. -->
	<script src="../games.js?v=2"></script>
	<script src="../draws.js?v=5"></script>
	<script src="schedules.js?v=6"></script>
</body>
</html>
