<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pavilion Sports League</title>
	<link rel="icon" href="images/logo.png" />
	<link rel="stylesheet" href="home.css" />
</head>
<body>
	<header>
		<h1><img src="images/psl-title.png" alt="Pavilion Sports League" /></h1>
		<img class="subtitle" src="images/psl-subtitle.png" alt="" />
	</header>

	<!-- Inert cards are plain <span>s, so nothing is clickable that shouldn't be: Registration
	     because entries have closed (registration/ is still there, just unlinked). Swap a
	     <span> back to an <a href> to re-enable one. -->
	<nav class="home-nav">
		<span class="home-card is-disabled" aria-disabled="true">
			<span class="home-card-title"><span class="home-card-icon" aria-hidden="true">📝</span>Registration</span>
			<span class="home-card-note">Registrations closed</span>
		</span>
		<a class="home-card" href="list/">
			<span class="home-card-title"><span class="home-card-icon" aria-hidden="true">👥</span>Participants list</span>
			<span class="home-card-note">Who has entered, by sport and category</span>
		</a>
		<a class="home-card" href="schedules/">
			<span class="home-card-title"><span class="home-card-icon" aria-hidden="true">📅</span>Schedule</span>
			<span class="home-card-note">Match times, courts and draws</span>
		</a>
		<a class="home-card" href="search/">
			<span class="home-card-title"><span class="home-card-icon" aria-hidden="true">🔍</span>Search</span>
			<span class="home-card-note">Find a participant and everything they entered</span>
		</a>
	</nav>

	<p class="credit">Made by Kaunteya Suryawanshi. C-163</p>
</body>
</html>
