<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Contact form</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<form id="form">
		<h1>Jade Indoor Sports Festival 2026</h1>

		<label for="name">Name</label>
		<input id="name" name="name" required />

		<label for="email">Email</label>
		<input id="email" name="email" type="email" required />

		<div class="row">
			<div>
				<label for="tower">Tower</label>
				<select id="tower" name="tower" required>
					<option value="" disabled selected>Select…</option>
					<option value="A">A</option>
					<option value="B">B</option>
					<option value="C">C</option>
					<option value="D">D</option>
					<option value="E">E</option>
					<option value="F">F</option>
					<option value="G">G</option>
					<option value="H">H</option>
				</select>
			</div>
			<div>
				<label for="house_number">House number</label>
				<select id="house_number" name="house_number" required>
					<option value="" disabled selected>Select…</option>
				</select>
			</div>
		</div>

		<label for="whatsapp">WhatsApp number</label>
		<input id="whatsapp" name="whatsapp" type="tel" required />

		<label for="age">Age</label>
		<input id="age" name="age" type="number" min="0" required />

		<label for="gender">Gender</label>
		<select id="gender" name="gender" required>
			<option value="" disabled selected>Select…</option>
			<option value="Female">Female</option>
			<option value="Male">Male</option>
		</select>

		<fieldset id="games" class="checkbox-group">
			<legend>Games</legend>
			<label><input type="checkbox" name="games" value="Carrom" /> Carrom</label>
			<label><input type="checkbox" name="games" value="8-ball pool" /> 8-ball pool</label>
			<label><input type="checkbox" name="games" value="Chess" /> Chess</label>
		</fieldset>

		<fieldset class="checkbox-group">
			<legend>Table Tennis category</legend>
			<div id="tt-options"></div>
		</fieldset>

		<fieldset class="checkbox-group">
			<legend>Badminton category</legend>
			<div id="badminton-options"></div>
		</fieldset>

		<button type="submit">Submit</button>
		<p id="status"></p>
	</form>

	<script src="app.js"></script>
</body>
</html>
