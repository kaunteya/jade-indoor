<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pavilion Sports League - Search</title>
	<link rel="icon" href="../images/logo.png" />
	<link rel="stylesheet" href="search.css" />
</head>
<body>
	<header>
		<img class="title" src="../images/psl-title.png" alt="Pavilion Sports League" />
		<h1>Search participants</h1>
	</header>

	<!-- Combobox pattern: the input owns the listbox below it and points at the highlighted
	     option with aria-activedescendant, so focus never leaves the input while arrowing
	     through suggestions. -->
	<div class="search-box">
		<!-- Wording matters here: Safari's Contacts AutoFill reads the label and placeholder
		     as well as the field itself, and the word "name" in either is enough to trigger
		     it. Keep both free of it. -->
		<label class="search-label" for="query">Find a participant</label>
		<div class="search-field">
			<!-- type="search" and name="q" — the canonical search-box shape — so Safari
			     doesn't classify this as a person-name field and offer AutoFill from
			     Contacts; it ignores autocomplete="off" for those. Suggestions are ours. -->
			<input
				id="query"
				name="q"
				type="search"
				role="combobox"
				autocomplete="off"
				autocorrect="off"
				autocapitalize="none"
				spellcheck="false"
				placeholder="Start typing…"
				aria-expanded="false"
				aria-controls="suggestions"
				aria-autocomplete="list"
				autofocus
			/>
			<button type="button" id="clear" class="clear" aria-label="Clear search" hidden>&times;</button>
			<ul id="suggestions" class="suggestions" role="listbox" aria-label="Matching participants" hidden></ul>
		</div>
	</div>

	<p id="status" class="status">Loading participants…</p>

	<section id="person" class="person" hidden aria-live="polite"></section>

	<p class="back"><a href="../">← Home</a></p>

	<script src="../games.js"></script>
	<script src="../draws.js"></script>
	<script src="search.js"></script>
</body>
</html>
